#:schema node_modules/wrangler/config-schema.json
name = "techpros-itsm-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ---------------------------------------------------------------------------
# Non-secret configuration. Secrets (JWT_SECRET, ...) are set with
# `wrangler secret put <NAME>` and must never be committed.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
# Comma separated list of browser origins allowed to call this API.
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:5173"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "1209600"
MAX_UPLOAD_BYTES = "10485760"
# Set to "true" only for the very first deployment so the first registered
# account becomes the administrator. Turn it off afterwards.
BOOTSTRAP_ADMIN = "true"

[[d1_databases]]
binding = "DB"
database_name = "itsm-db"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create itsm-db` output
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000" # replace with `wrangler kv namespace create CACHE` output

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000001" # replace with `wrangler kv namespace create RATE_LIMIT` output

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "itsm-uploads"

[triggers]
# 06:00 UTC daily maintenance + hourly SLA / reminder sweep.
crons = ["0 6 * * *", "*/15 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[env.preview]
name = "techpros-itsm-api-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
ALLOWED_ORIGINS = "https://preview.example.com"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "1209600"
MAX_UPLOAD_BYTES = "10485760"
BOOTSTRAP_ADMIN = "false"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "itsm-db-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000001"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "itsm-uploads-preview"

[env.production]
name = "techpros-itsm-api-production"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://app.example.com"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "1209600"
MAX_UPLOAD_BYTES = "10485760"
BOOTSTRAP_ADMIN = "false"

[[env.production.d1_databases]]
binding = "DB"
database_name = "itsm-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000001"

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "itsm-uploads"

[env.production.triggers]
crons = ["0 6 * * *", "*/15 * * * *"]
